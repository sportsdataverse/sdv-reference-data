[project]
name = "sdv-reference-data"
version = "0.1.0"
description = "Season-by-season conference, division and affiliation reference data for SportsDataverse leagues"
requires-python = ">=3.11"
dependencies = ["polars>=1.20,<2", "requests>=2.31"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
